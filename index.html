<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>PAD - Asistencia Docente</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
      color: #1f2937;
      text-align: center;
    }

    header {
      background: #163a63;
      color: white;
      padding: 16px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 31px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 16px;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    #estado {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 21px;
      font-weight: bold;
      background: #e5e7eb;
    }

    #reader {
      width: 100%;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    #respuesta {
      margin-top: 14px;
      padding: 18px 12px;
      min-height: 135px;
      border-radius: 12px;
      background: #eef2f7;
    }

    #movimiento {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #docente {
      font-size: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    #hora {
      margin-top: 8px;
      font-size: 20px;
    }

    #idPad {
      margin-top: 7px;
      font-size: 14px;
      color: #64748b;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 17px;
      border: 0;
      border-radius: 11px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #btnIniciar {
      background: #167647;
      color: white;
    }

    #btnDetener {
      display: none;
      background: #6b7280;
      color: white;
    }

    .azul {
      background: #dbeafe !important;
      color: #1e40af !important;
    }

    .verde {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .amarillo {
      background: #fef3c7 !important;
      color: #92400e !important;
    }

    .rojo {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .procesando {
      background: #ede9fe !important;
      color: #5b21b6 !important;
    }

    .info {
      margin-top: 15px;
      padding: 11px;
      background: #f3f4f6;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .pie {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>PAD</h1>
  <p>Proyecto Asistencia Docente</p>
</header>

<div class="contenedor">

  <div class="panel">

    <div id="estado">
      LECTOR DETENIDO
    </div>

    <div id="reader"></div>

    <div id="respuesta">

      <div id="movimiento">
        PAD
      </div>

      <div id="docente">
        Presione INICIAR LECTOR
      </div>

      <div id="hora">
        ---
      </div>

      <div id="idPad"></div>

    </div>

    <button id="btnIniciar">
      📷 INICIAR LECTOR
    </button>

    <button id="btnDetener">
      ⏹ DETENER LECTOR
    </button>

    <div class="info">
      <strong>TERMINAL PAD</strong><br>
      Cámara continua activa<br>
      Registro automático de asistencia
    </div>

    <div class="pie">
      PAD – Proyecto Asistencia Docente
    </div>

  </div>

</div>


<script>

/*************************************************************
 * PAD LECTOR V4
 *************************************************************/

const PAD_API =
  "https://script.google.com/macros/s/AKfycby8Gk1UXa4izqLHZ_eWJFx0cKZz3shOkChHMkLEu1OI2TRX-ZyEMdZnPO23PyAyyHha/exec";


let lector = null;

let funcionando = false;

let procesando = false;

let numeroSolicitud = 0;


const estado =
  document.getElementById("estado");

const respuesta =
  document.getElementById("respuesta");

const movimiento =
  document.getElementById("movimiento");

const docente =
  document.getElementById("docente");

const hora =
  document.getElementById("hora");

const idPad =
  document.getElementById("idPad");

const btnIniciar =
  document.getElementById("btnIniciar");

const btnDetener =
  document.getElementById("btnDetener");


btnIniciar.addEventListener(
  "click",
  iniciarLector
);

btnDetener.addEventListener(
  "click",
  detenerLector
);


/*************************************************************
 * INICIAR CÁMARA
 *************************************************************/

async function iniciarLector() {

  if (funcionando) {
    return;
  }

  btnIniciar.disabled = true;

  estado.textContent =
    "ABRIENDO CÁMARA...";

  estado.className =
    "amarillo";

  try {

    lector =
      new Html5Qrcode("reader");

    const configuracion = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const lado =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.80
          );

        return {
          width: lado,
          height: lado
        };

      }

    };


    await lector.start(

      {
        facingMode: "environment"
      },

      configuracion,

      qrDetectado,

      function() {
        // Sin QR: no hacemos nada.
      }

    );


    funcionando = true;

    mostrarEsperando();

    btnIniciar.style.display =
      "none";

    btnDetener.style.display =
      "block";

  }

  catch(error) {

    console.error(error);

    funcionando = false;

    btnIniciar.disabled = false;

    estado.textContent =
      "ERROR DE CÁMARA";

    estado.className =
      "rojo";

    movimiento.textContent =
      "ERROR";

    docente.textContent =
      error && error.message
        ? error.message
        : String(error);

  }

}


/*************************************************************
 * QR DETECTADO
 *************************************************************/

function qrDetectado(textoQR) {

  if (procesando) {
    return;
  }

  const id =
    extraerIdPAD(textoQR);

  if (!id) {
    return;
  }

  procesando = true;

  estado.textContent =
    "PROCESANDO REGISTRO...";

  estado.className =
    "procesando";

  respuesta.className =
    "procesando";

  movimiento.textContent =
    "PROCESANDO";

  docente.textContent =
    "Consultando PAD...";

  hora.textContent =
    "";

  idPad.textContent =
    "ID PAD: " + id;

  enviarAPad(id);

}


/*************************************************************
 * EXTRAER ID
 *************************************************************/

function extraerIdPAD(texto) {

  const valor =
    String(texto || "").trim();

  try {

    const url =
      new URL(valor);

    const id =
      url.searchParams.get("id");

    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  }
  catch(error) {
    // Puede contener directamente el ID.
  }

  return valor.toUpperCase();

}


/*************************************************************
 * ENVIAR ID A PAD API
 *
 * Utilizamos JSONP para evitar problemas CORS entre
 * GitHub Pages y Google Apps Script.
 *************************************************************/

function enviarAPad(id) {

  numeroSolicitud++;

  const callback =
    "respuestaPAD_" +
    Date.now() +
    "_" +
    numeroSolicitud;

  const script =
    document.createElement("script");

  let terminado = false;


  const limpiar = function() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callback];
    }
    catch(error) {
      window[callback] = undefined;
    }

  };


  const temporizador =
    setTimeout(function() {

      if (terminado) {
        return;
      }

      terminado = true;

      limpiar();

      mostrarError(
        id,
        "SIN RESPUESTA DEL SERVIDOR"
      );

    }, 12000);


  window[callback] =
    function(datos) {

      if (terminado) {
        return;
      }

      terminado = true;

      clearTimeout(
        temporizador
      );

      limpiar();

      procesarRespuesta(
        id,
        datos
      );

    };


  script.onerror =
    function() {

      if (terminado) {
        return;
      }

      terminado = true;

      clearTimeout(
        temporizador
      );

      limpiar();

      mostrarError(
        id,
        "NO SE PUDO CONECTAR CON PAD"
      );

    };


  script.src =
    PAD_API +
    "?id=" +
    encodeURIComponent(id) +
    "&callback=" +
    encodeURIComponent(callback) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/*************************************************************
 * RESPUESTA DEL SERVIDOR
 *************************************************************/

function procesarRespuesta(
  id,
  datos
) {

  if (
    datos &&
    datos.ok === true
  ) {

    mostrarRegistroCorrecto(
      datos
    );

    return;

  }


  const estadoServidor =
    datos && datos.estado
      ? String(datos.estado)
      : "ERROR";


  if (
    estadoServidor ===
    "DUPLICADO"
  ) {

    mostrarDuplicado(
      id,
      datos
    );

    return;

  }


  const mensaje =
    datos && datos.mensaje
      ? datos.mensaje
      : "ERROR DE REGISTRO";


  mostrarError(
    id,
    mensaje
  );

}


/*************************************************************
 * REGISTRO CORRECTO
 *************************************************************/

function mostrarRegistroCorrecto(
  datos
) {

  estado.textContent =
    "✅ REGISTRO CORRECTO";

  estado.className =
    "verde";

  respuesta.className =
    "verde";

  movimiento.textContent =
    "✅ " +
    datos.movimiento +
    " REGISTRADA";

  docente.textContent =
    datos.docente || "";

  hora.textContent =
    datos.hora || "";

  idPad.textContent =
    "ID PAD: " +
    (datos.id || "");

  beepCorrecto();

  vibrarCorrecto();

  setTimeout(
    mostrarEsperando,
    2800
  );

}


/*************************************************************
 * DUPLICADO
 *************************************************************/

function mostrarDuplicado(
  id,
  datos
) {

  estado.textContent =
    "⚠️ QR YA REGISTRADO";

  estado.className =
    "amarillo";

  respuesta.className =
    "amarillo";

  movimiento.textContent =
    "LECTURA DUPLICADA";

  docente.textContent =
    datos.docente ||
    "Espere antes de volver a presentar el QR";

  hora.textContent =
    "";

  idPad.textContent =
    "ID PAD: " + id;

  beepAviso();

  setTimeout(
    mostrarEsperando,
    2500
  );

}


/*************************************************************
 * ERROR
 *************************************************************/

function mostrarError(
  id,
  mensaje
) {

  estado.textContent =
    "❌ REGISTRO RECHAZADO";

  estado.className =
    "rojo";

  respuesta.className =
    "rojo";

  movimiento.textContent =
    "NO REGISTRADO";

  docente.textContent =
    mensaje;

  hora.textContent =
    "";

  idPad.textContent =
    "ID PAD: " + id;

  beepError();

  if (navigator.vibrate) {
    navigator.vibrate(
      [200, 100, 200]
    );
  }

  setTimeout(
    mostrarEsperando,
    3000
  );

}


/*************************************************************
 * ESPERANDO SIGUIENTE DOCENTE
 *************************************************************/

function mostrarEsperando() {

  procesando = false;

  estado.textContent =
    "🟢 CÁMARA ACTIVA – ACERQUE SU QR";

  estado.className =
    "azul";

  respuesta.className = "";

  movimiento.textContent =
    "LISTO";

  docente.textContent =
    "Esperando próximo docente";

  hora.textContent =
    "";

  idPad.textContent =
    "";

}


/*************************************************************
 * SONIDOS
 *************************************************************/

function tono(
  frecuencia,
  duracion
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const contexto =
      new AudioContext();

    const oscilador =
      contexto.createOscillator();

    const ganancia =
      contexto.createGain();

    oscilador.connect(
      ganancia
    );

    ganancia.connect(
      contexto.destination
    );

    oscilador.frequency.value =
      frecuencia;

    ganancia.gain.setValueAtTime(
      0.20,
      contexto.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
      0.01,
      contexto.currentTime +
      duracion
    );

    oscilador.start();

    oscilador.stop(
      contexto.currentTime +
      duracion
    );

  }
  catch(error) {
    console.log(
      "Audio no disponible"
    );
  }

}


function beepCorrecto() {

  tono(
    950,
    0.16
  );

}


function beepAviso() {

  tono(
    600,
    0.22
  );

}


function beepError() {

  tono(
    300,
    0.35
  );

}


function vibrarCorrecto() {

  if (navigator.vibrate) {

    navigator.vibrate(
      120
    );

  }

}


/*************************************************************
 * DETENER
 *************************************************************/

async function detenerLector() {

  if (
    !lector ||
    !funcionando
  ) {
    return;
  }

  try {

    await lector.stop();

    lector.clear();

  }
  catch(error) {

    console.error(error);

  }

  funcionando =
    false;

  procesando =
    false;

  estado.textContent =
    "LECTOR DETENIDO";

  estado.className = "";

  respuesta.className = "";

  movimiento.textContent =
    "PAD";

  docente.textContent =
    "Lector detenido";

  hora.textContent =
    "";

  idPad.textContent =
    "";

  btnIniciar.disabled =
    false;

  btnIniciar.style.display =
    "block";

  btnDetener.style.display =
    "none";

}

</script>

</body>
</html>
