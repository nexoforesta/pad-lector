<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>PAD - Lector QR V3</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
      color: #1f2937;
      text-align: center;
    }

    header {
      background: #163a63;
      color: white;
      padding: 16px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 16px;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .panel {
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    #estado {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 21px;
      font-weight: bold;
      background: #e5e7eb;
    }

    #reader {
      width: 100%;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    #resultado {
      margin-top: 14px;
      padding: 16px;
      min-height: 95px;
      background: #eef2f7;
      border-radius: 10px;
    }

    #codigo {
      display: block;
      margin-top: 8px;
      font-size: 32px;
      font-weight: bold;
      color: #163a63;
      word-break: break-word;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 17px;
      border: 0;
      border-radius: 11px;
      font-size: 20px;
      font-weight: bold;
    }

    #btnIniciar {
      background: #167647;
      color: white;
    }

    #btnDetener {
      display: none;
      background: #6b7280;
      color: white;
    }

    .diagnostico {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: left;
      line-height: 1.7;
      font-size: 14px;
    }

    .azul {
      background: #dbeafe !important;
      color: #1e40af !important;
    }

    .verde {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .amarillo {
      background: #fef3c7 !important;
      color: #92400e !important;
    }

    .rojo {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .pie {
      margin-top: 15px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>PAD</h1>
  <p>Proyecto Asistencia Docente</p>
</header>

<div class="contenedor">

  <div class="panel">

    <div id="estado">
      LECTOR DETENIDO
    </div>

    <div id="reader"></div>

    <div id="resultado">
      Acerque un código QR a la cámara.
      <span id="codigo">---</span>
    </div>

    <button id="btnIniciar">
      📷 INICIAR LECTOR
    </button>

    <button id="btnDetener">
      ⏹ DETENER LECTOR
    </button>

    <div class="diagnostico">

      <strong>DIAGNÓSTICO PAD V3</strong><br>

      Cámara:
      <span id="diagCamara">
        detenida
      </span>
      <br>

      Lecturas correctas:
      <span id="contador">
        0
      </span>
      <br>

      Última lectura:
      <span id="ultimaLectura">
        ninguna
      </span>

    </div>

    <div class="pie">
      PAD – PRUEBA DE LECTOR V3<br>
      No registra asistencia.
    </div>

  </div>

</div>

<script>

  let lector = null;
  let funcionando = false;
  let bloqueado = false;
  let cantidad = 0;

  const estado =
    document.getElementById("estado");

  const codigo =
    document.getElementById("codigo");

  const resultado =
    document.getElementById("resultado");

  const btnIniciar =
    document.getElementById("btnIniciar");

  const btnDetener =
    document.getElementById("btnDetener");

  const diagCamara =
    document.getElementById("diagCamara");

  const contador =
    document.getElementById("contador");

  const ultimaLectura =
    document.getElementById("ultimaLectura");


  btnIniciar.addEventListener(
    "click",
    iniciarLector
  );

  btnDetener.addEventListener(
    "click",
    detenerLector
  );


  async function iniciarLector() {

    if (funcionando) {
      return;
    }

    btnIniciar.disabled = true;

    estado.textContent =
      "ABRIENDO CÁMARA...";

    estado.className =
      "amarillo";

    diagCamara.textContent =
      "solicitando cámara";

    try {

      lector =
        new Html5Qrcode("reader");

      const configuracion = {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const lado =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.80
            );

          return {
            width: lado,
            height: lado
          };

        }

      };

      await lector.start(

        {
          facingMode: "environment"
        },

        configuracion,

        qrDetectado,

        qrNoDetectado

      );

      funcionando = true;

      estado.textContent =
        "🟢 CÁMARA ACTIVA – ACERQUE EL QR";

      estado.className =
        "azul";

      diagCamara.textContent =
        "activa / buscando QR";

      btnIniciar.style.display =
        "none";

      btnDetener.style.display =
        "block";

    }
    catch(error) {

      console.error(error);

      funcionando = false;

      btnIniciar.disabled = false;

      estado.textContent =
        "ERROR DE CÁMARA";

      estado.className =
        "rojo";

      diagCamara.textContent =
        error && error.message
          ? error.message
          : String(error);

    }

  }


  function qrNoDetectado(error) {

    /*
      No hacemos absolutamente nada.

      Esta función se ejecuta muchas veces
      mientras la cámara busca un QR.
    */

  }


  function qrDetectado(textoQR) {

    if (bloqueado) {
      return;
    }

    bloqueado = true;

    cantidad++;

    contador.textContent =
      cantidad;

    const texto =
      String(textoQR).trim();

    ultimaLectura.textContent =
      texto;

    const id =
      extraerIdPAD(texto);

    codigo.textContent =
      id;

    estado.textContent =
      "✅ QR DETECTADO";

    estado.className =
      "verde";

    resultado.className =
      "verde";

    hacerBeep();

    if (navigator.vibrate) {
      navigator.vibrate(150);
    }

    setTimeout(function() {

      codigo.textContent =
        "---";

      estado.textContent =
        "🟢 CÁMARA ACTIVA – ACERQUE EL SIGUIENTE QR";

      estado.className =
        "azul";

      resultado.className =
        "";

      bloqueado =
        false;

    }, 2500);

  }


  function extraerIdPAD(texto) {

    try {

      const url =
        new URL(texto);

      const id =
        url.searchParams.get("id");

      if (id) {

        return id
          .trim()
          .toUpperCase();

      }

    }
    catch(error) {

      // Si no es una URL,
      // usamos directamente el contenido.

    }

    return texto.toUpperCase();

  }


  function hacerBeep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const contexto =
        new AudioContext();

      const oscilador =
        contexto.createOscillator();

      const volumen =
        contexto.createGain();

      oscilador.connect(volumen);

      volumen.connect(
        contexto.destination
      );

      oscilador.frequency.value =
        900;

      volumen.gain.setValueAtTime(
        0.20,
        contexto.currentTime
      );

      volumen.gain.exponentialRampToValueAtTime(
        0.01,
        contexto.currentTime + 0.15
      );

      oscilador.start(
        contexto.currentTime
      );

      oscilador.stop(
        contexto.currentTime + 0.15
      );

    }
    catch(error) {

      console.log(
        "Beep no disponible"
      );

    }

  }


  async function detenerLector() {

    if (!lector || !funcionando) {
      return;
    }

    try {

      await lector.stop();

      lector.clear();

    }
    catch(error) {

      console.error(error);

    }

    funcionando =
      false;

    bloqueado =
      false;

    estado.textContent =
      "LECTOR DETENIDO";

    estado.className =
      "";

    diagCamara.textContent =
      "detenida";

    btnIniciar.disabled =
      false;

    btnIniciar.style.display =
      "block";

    btnDetener.style.display =
      "none";

  }

</script>

</body>
</html>
