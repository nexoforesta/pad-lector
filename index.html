<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>PAD - Lector QR</title>

  <!-- MOTOR QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef1f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      text-align: center;
    }

    header {
      background: #153b66;
      color: white;
      padding: 16px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 16px;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    #estado {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      font-size: 21px;
      font-weight: bold;
      background: #e5e7eb;
    }

    #reader {
      width: 100%;
      min-height: 320px;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover !important;
    }

    #resultado {
      margin-top: 14px;
      padding: 15px;
      min-height: 90px;
      border-radius: 10px;
      background: #eef2f7;
    }

    #codigo {
      display: block;
      margin-top: 8px;
      font-size: 32px;
      font-weight: bold;
      color: #153b66;
      word-break: break-word;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 17px;
      border: 0;
      border-radius: 11px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #iniciar {
      background: #167647;
      color: white;
    }

    #detener {
      background: #6b7280;
      color: white;
      display: none;
    }

    .diagnostico {
      margin-top: 15px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 10px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
    }

    .verde {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .azul {
      background: #dbeafe !important;
      color: #1e40af !important;
    }

    .amarillo {
      background: #fef3c7 !important;
      color: #92400e !important;
    }

    .rojo {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .pie {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
    }

  </style>
</head>

<body>

<header>
  <h1>PAD</h1>
  <p>Proyecto Asistencia Docente</p>
</header>


<div class="contenedor">

  <div class="panel">

    <div id="estado">
      LECTOR DETENIDO
    </div>


    <div id="reader"></div>


    <div id="resultado">

      Acerque un código QR a la cámara.

      <span id="codigo">
        ---
      </span>

    </div>


    <button id="iniciar">
      📷 INICIAR CÁMARA
    </button>


    <button id="detener">
      ⏹ DETENER CÁMARA
    </button>


    <div class="diagnostico">

      <strong>DIAGNÓSTICO PAD</strong><br>

      Estado:
      <span id="diagEstado">
        esperando
      </span>
      <br>

      Lecturas correctas:
      <span id="contador">
        0
      </span>
      <br>

      Último QR:
      <span id="ultimo">
        ninguno
      </span>
      <br>

      Motor:
      html5-qrcode 2.3.8

    </div>


    <div class="pie">

      PAD – PRUEBA DE LECTOR<br>

      Esta versión NO registra asistencia.

    </div>

  </div>

</div>


<script>

let lector = null;

let funcionando = false;

let bloqueado = false;

let cantidadLecturas = 0;


const estado =
  document.getElementById("estado");

const codigo =
  document.getElementById("codigo");

const resultado =
  document.getElementById("resultado");

const btnIniciar =
  document.getElementById("iniciar");

const btnDetener =
  document.getElementById("detener");

const diagEstado =
  document.getElementById("diagEstado");

const contador =
  document.getElementById("contador");

const ultimo =
  document.getElementById("ultimo");


btnIniciar.addEventListener(
  "click",
  iniciarCamara
);


btnDetener.addEventListener(
  "click",
  detenerCamara
);



async function iniciarCamara() {

  if (funcionando) {
    return;
  }

  estado.textContent =
    "SOLICITANDO CÁMARA...";

  estado.className =
    "amarillo";

  diagEstado.textContent =
    "solicitando permiso";


  try {

    lector =
      new Html5Qrcode("reader");


    const configuracion = {

      fps: 15,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const ancho =
          Math.floor(
            viewfinderWidth * 0.85
          );

        const alto =
          Math.floor(
            viewfinderHeight * 0.75
          );

        return {
          width: ancho,
          height: alto
        };

      },

      aspectRatio: 1.333333,

      disableFlip: false,

      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }

    };


    const camara = {

      facingMode: {
        ideal: "environment"
      },

      width: {
        ideal: 1280
      },

      height: {
        ideal: 720
      }

    };


    await lector.start(

      camara,

      configuracion,

      qrDetectado,

      qrNoDetectado

    );


    funcionando = true;


    estado.textContent =
      "🟢 CÁMARA ACTIVA – ACERQUE EL QR";

    estado.className =
      "azul";


    diagEstado.textContent =
      "cámara activa / buscando QR";


    btnIniciar.style.display =
      "none";

    btnDetener.style.display =
      "block";


  }
  catch(error) {

    console.error(error);

    funcionando = false;


    estado.textContent =
      "ERROR DE CÁMARA";

    estado.className =
      "rojo";


    diagEstado.textContent =
      error && error.message
      ? error.message
      : String(error);

  }

}



function qrNoDetectado(error) {

  /*
    Es normal que esta función se ejecute
    continuamente mientras no haya
    un QR delante de la cámara.

    No reproducimos sonidos aquí.
  */

}



function qrDetectado(
  textoDecodificado,
  resultadoDecodificado
) {

  if (bloqueado) {
    return;
  }


  bloqueado = true;


  cantidadLecturas++;

  contador.textContent =
    cantidadLecturas;


  const texto =
    String(textoDecodificado).trim();


  ultimo.textContent =
    texto;


  const idPAD =
    obtenerIdPAD(texto);


  codigo.textContent =
    idPAD;


  resultado.className =
    "verde";


  estado.textContent =
    "✅ QR DETECTADO";

  estado.className =
    "verde";


  diagEstado.textContent =
    "QR leído correctamente";


  beep();


  if (navigator.vibrate) {

    navigator.vibrate(150);

  }


  setTimeout(function() {

    resultado.className = "";


    codigo.textContent =
      "---";


    estado.textContent =
      "🟢 CÁMARA ACTIVA – ACERQUE EL SIGUIENTE QR";

    estado.className =
      "azul";


    diagEstado.textContent =
      "cámara activa / buscando QR";


    bloqueado = false;

  }, 2500);

}



function obtenerIdPAD(texto) {

  try {

    const direccion =
      new URL(texto);


    const id =
      direccion.searchParams.get("id");


    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  }
  catch(error) {

    // El QR puede contener
    // directamente el ID PAD.

  }


  return texto.toUpperCase();

}



function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audio =
      new AudioContext();


    const oscilador =
      audio.createOscillator();


    const volumen =
      audio.createGain();


    oscilador.connect(volumen);

    volumen.connect(
      audio.destination
    );


    oscilador.frequency.value =
      950;


    volumen.gain.setValueAtTime(
      0.25,
      audio.currentTime
    );


    volumen.gain.exponentialRampToValueAtTime(
      0.01,
      audio.currentTime + 0.18
    );


    oscilador.start();


    oscilador.stop(
      audio.currentTime + 0.18
    );

  }
  catch(error) {

    console.log(
      "Audio no disponible"
    );

  }

}



async function detenerCamara() {

  if (!lector || !funcionando) {
    return;
  }


  try {

    await lector.stop();

    await lector.clear();

  }
  catch(error) {

    console.error(error);

  }


  funcionando = false;


  estado.textContent =
    "LECTOR DETENIDO";

  estado.className = "";


  diagEstado.textContent =
    "detenido";


  btnIniciar.style.display =
    "block";

  btnDetener.style.display =
    "none";

}

</script>

</body>
</html>
